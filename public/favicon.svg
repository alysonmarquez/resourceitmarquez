<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="spectrumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246386" />
      <stop offset="30%" stop-color="#967189" />
      <stop offset="65%" stop-color="#997074" />
      <stop offset="100%" stop-color="#E0A34A" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0A34A" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Background -->
  <rect width="512" height="512" rx="128" fill="#030C1E" />
  
  <!-- Outer Spectrum Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#spectrumGradient)" stroke-width="18" opacity="0.9" />
  
  <!-- Inner Subtle Backdrop -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#103653" fill-opacity="0.35" />

  <!-- Monogram R (Resource IT) -->
  <path d="M 170 140 L 290 140 C 345 140 380 170 380 220 C 380 262 348 292 300 298 L 385 372 L 315 372 L 240 305 L 230 305 L 230 372 L 170 372 Z M 230 195 L 230 255 L 285 255 C 315 255 330 242 330 225 C 330 208 315 195 285 195 Z" fill="#E6E9EF" />

  <!-- Code Slash Indicator inside Logo -->
  <path d="M 335 155 L 365 125" stroke="url(#spectrumGradient)" stroke-width="14" stroke-linecap="round" />

  <!-- Gold Star Accent Spark -->
  <path d="M 390 110 Q 390 135 415 135 Q 390 135 390 160 Q 390 135 365 135 Q 390 135 390 110 Z" fill="url(#goldGlow)" filter="url(#glow)" />
</svg>
